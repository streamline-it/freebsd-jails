---
- name: ensure key variables are defined
  ansible.builtin.assert:
    that:
      - freebsd_jails_online_pull is defined
      - freebsd_jails_jails_path is defined
      - freebsd_jails_jails_path is truthy
      - freebsd_jails_jails_directory is defined
      - freebsd_jails_jails_directory is truthy
      - freebsd_jails_jails_zfs_mountpoint is defined
      - freebsd_jails_jails_zfs_mountpoint is truthy
      - freebsd_jails_jails_base_dir is defined
      - freebsd_jails_jails_base_dir is truthy
      - freebsd_jails_jail_folders is defined
      - freebsd_jails_jail_folders is truthy
      - freebsd_jails_jailinfo is defined
      - freebsd_jails_jailinfo is truthy
      - freebsd_jails_users is defined
      - freebsd_jails_users is truthy
      - freebsd_jails_host_entries is defined
      - freebsd_jails_host_entries is truthy
    fail_msg: "Make sure the following variables defined and have valid values"

- name: check boolean variables have correct values
  ansible.builtin.assert:
    that:
      - freebsd_jails_online_pull == true or freebsd_jails_online_pull is false
    fail_msg:

- name: ensure freebsd_jails_online_pull is set to the correct value
  ansible.builtin.assert:
    that: freebsd_jails_online_pull == false or freebsd_online_pull == true
    fail_msg: "freebsd_jails_online_pull must be true or false"
