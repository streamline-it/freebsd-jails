---
- name: check see if group exists
  ignore_errors: true
  with_nested:
    - "{{ freebsd_jails_jailinfo }}"
    - "{{ freebsd_jails_groups }}"
  register: groups_stat
  changed_when: false
  failed_when: groups_stat['rc'] > 2
  ansible.builtin.command:
    cmd: jexec -lU root {{ item[0]['name'] }} getent group {{ item[1]['name'] }}

- name: ensure groups exist
  ignore_errors: true
  when: groups_stat['results'][my_loop_var]['rc'] == 2
  with_nested:
    - "{{ freebsd_jails_jailinfo }}"
    - "{{ freebsd_jails_groups }}"
  loop_control:
    index_var: my_loop_var
  ansible.builtin.command:
    cmd: jexec -lU root {{ item[0]['name'] }} sh -c 'pw groupadd -g {{ item[1].gid }} -n {{ item[1].name }}'
