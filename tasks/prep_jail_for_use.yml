---
- name: restart ifnet service for jails
  when: jail_conf_check['stat']['exists'] == false
  args:
    executable: /bin/sh
  loop:
    "{{ freebsd_jails_jailinfo }}"
  ansible.builtin.shell:
    "service -j {{ item['name'] }} netif restart"

- name: restart routed service for jails
  when: jail_conf_check['stat']['exists'] == false
  args:
    executable: /bin/sh
  loop:
    "{{ freebsd_jails_jailinfo }}"
  ansible.builtin.shell:
    "service -j {{ item['name'] }} routed restart"

- name: update package system for jails
  when: jail_conf_check['stat']['exists'] == false
  args:
    executable: /bin/sh
  loop:
    "{{ freebsd_jails_jailinfo }}"
  ansible.builtin.shell:
    "echo 'y' | pkg -j {{ item['name'] }} update -f"
