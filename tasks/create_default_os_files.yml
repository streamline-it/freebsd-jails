- name: check to see if /etc/fstab exists
  register: fstab_stat
  loop:
    "{{ freebsd_jails_jailinfo }}"
  ansible.builtin.stat:
    path: "{{ item['path'] }}/etc/fstab"
    get_attributes: true

- name: ensure fstab file exists
  when: fstab_stat['results'][my_loop_var]['stat']['exists'] == false
  loop:
    "{{ freebsd_jails_jailinfo }}"
  loop_control:
    index_var: my_loop_var
  ansible.builtin.copy:
    content: ""
    dest: "{{ item['path'] }}/etc/fstab"
    owner: root
    group: wheel
    mode: '0744'

