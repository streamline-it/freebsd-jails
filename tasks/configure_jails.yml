---
- name: ensure jails config file exists
  ansible.builtin.template:
    src: jail.conf.j2
    dest: /etc/jail.conf
    owner: root
    group: wheel
    mode: "0644"

- name: ensure entry exists in rc.conf to start jail
  loop:
    - jail_enable
    - jail_parallel_start
  community.general.sysrc:
    name: "{{ item  }}"
    value: "YES"
    state: present

- name: check to see if jail service is started
  register: jail_stat
  changed_when: false
  ansible.builtin.shell:
    cmd: service jail status | wc -l | tr -d ' '

# not sure why, ansible.builtin.service not working
- name: ensure jails service is started
  when: jail_stat['stdout'] == "1"
  ansible.builtin.command:
    cmd: service jail start

- name: ensure dns resolver is setup
  loop:
    "{{ freebsd_jails_jailinfo }}"
  ansible.builtin.blockinfile:
    path: "{{ item['path'] }}/etc/resolv.conf"
    block: |
      {{ item['dns_resolver0'] }}
      {{ item['dns_resolver1'] }}
    marker: "#< {mark} ansible blockinfile block >"
    marker_begin: "Start"
    owner: root
    group: wheel
    mode: "0644"
    state: present
